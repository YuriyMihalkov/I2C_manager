# =============================================================================
#  CI для проекта I2C / PCF8574 на Raspberry Pi 3
# =============================================================================

stages:
  - build
  - test

variables:
  BUILD_DIR: "build"
  CTEST_OUTPUT_ON_FAILURE: "1"
  GTEST_OUTPUT_FILE: "gtest-report.xml"
  GIT_SUBMODULE_STRATEGY: recursive

default:
  image: arm32v7/debian:bookworm
  tags:
    - RassberryPiB3Runner

build:
  stage: build
  script:
    - echo "==> Конфигурация CMake"
    - cmake -S . -B "${BUILD_DIR}" -DCMAKE_BUILD_TYPE=Debug
    - echo "==> Сборка"
    - cmake --build "${BUILD_DIR}" -j"$(nproc)"
  artifacts:
    paths:
      # Забираем и бинарник, и shared-библиотеку
      - "${BUILD_DIR}/tests/i2c_pcf8574_tests"
      - "${BUILD_DIR}/libI2C.so"
    expire_in: 1 week

test:
  stage: test
  dependencies:
    - build
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq libgtest-dev
    # Проверяем, что шина видна (диагностика при падении)
    - 'ls -l /dev/i2c-* || echo "ВНИМАНИЕ: устройство I2C не найдено внутри контейнера"'
  script:
    - echo "==> Запуск GoogleTest"
    # 1. Указываем системе, где искать libI2C.so
    - export LD_LIBRARY_PATH="${CI_PROJECT_DIR}/${BUILD_DIR}:$LD_LIBRARY_PATH"
    # 2. Переходим в папку, где лежит бинарник
    - cd "${BUILD_DIR}/tests"
    # 3. Запускаем
    - ./i2c_pcf8574_tests --gtest_output="xml:${GTEST_OUTPUT_FILE}"
  artifacts:
    when: always
    reports:
      # Путь к отчету теперь внутри build/tests/
      junit: "${BUILD_DIR}/tests/${GTEST_OUTPUT_FILE}"
    paths:
      - "${BUILD_DIR}/tests/${GTEST_OUTPUT_FILE}"
    expire_in: 1 month
